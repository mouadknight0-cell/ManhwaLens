name: Android build

on:
  push:
    branches: [main, master, arena/cebceb7a-manhwalens]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # gradle.properties is tuned for a 2 GB box; CI runners have far more RAM.
      GRADLE_ARGS: >-
        --no-daemon --stacktrace --no-configuration-cache
        -Dorg.gradle.jvmargs=-Xmx4g
        -Dorg.gradle.workers.max=4
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: |
          set +e
          ./gradlew $GRADLE_ARGS :app:testDebugUnitTest > /tmp/ut.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            # Surface compiler/test errors as annotations (the raw log is not always
            # retrievable through the API from a sandbox).
            grep -aE "^e: |^w: .*error|error: |Execution failed for task|^[A-Za-z0-9_.]+Test > .* FAILED|tests completed" /tmp/ut.log \
              | head -20 | sed 's/%/%25/g' | while IFS= read -r line; do
                  echo "::error::$line"
                done
            tail -40 /tmp/ut.log
            exit $code
          fi

      - name: Build debug APK
        run: ./gradlew $GRADLE_ARGS :app:assembleDebug

      - name: Rename APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          OUT="ManhwaLens-v${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: ManhwaLens-debug-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Attach APK to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.file }}
          generate_release_notes: true
