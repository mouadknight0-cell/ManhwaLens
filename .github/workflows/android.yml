name: Android build

on:
  push:
    branches: [main, master, arena/cebceb7a-manhwalens]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # gradle.properties is tuned for a 2 GB box; CI runners have far more RAM.
      GRADLE_ARGS: >-
        --no-daemon --stacktrace --no-configuration-cache
        -Dorg.gradle.jvmargs=-Xmx4g
        -Dorg.gradle.workers.max=4
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: |
          set +e
          ./gradlew $GRADLE_ARGS :app:testDebugUnitTest > /tmp/gradle-test.log 2>&1
          RC=$?
          cat /tmp/gradle-test.log
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for p in sorted(glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")):
              try:
                  root = ET.parse(p).getroot()
              except Exception:
                  continue
              for tc in root.findall("testcase"):
                  f = tc.find("failure")
                  e = tc.find("error")
                  bad = f if f is not None else e
                  if bad is not None:
                      msg = (bad.attrib.get("message") or bad.text or "").replace("\n", " ")[:300]
                      print(f"::error::{tc.attrib.get('classname')}.{tc.attrib.get('name')}: {msg}")
              if "EndToEndBenchmarkTest" in p:
                  so = root.find("system-out")
                  if so is not None and so.text:
                      lines = [l.strip() for l in so.text.strip().splitlines() if l.strip()]
                      # Group into <=8 compact notice lines (GitHub caps annotations at 10/step)
                      chunk = []
                      for l in lines:
                          if l.startswith("===") or l.startswith("Comparison"):
                              if chunk:
                                  print("::notice::" + " | ".join(chunk))
                              chunk = [l]
                          else:
                              chunk.append(l)
                      if chunk:
                          print("::notice::" + " | ".join(chunk))
          PY
          if [ $RC -ne 0 ]; then
            (grep -E "^e: " /tmp/gradle-test.log; awk '/\* What went wrong:/,/\* Try:/' /tmp/gradle-test.log) | head -n 6 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
          fi
          exit $RC

      - name: Build debug APK
        run: ./gradlew $GRADLE_ARGS :app:assembleDebug

      - name: Rename APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          OUT="ManhwaLens-v${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: ManhwaLens-debug-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Attach APK to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.file }}
          generate_release_notes: true
